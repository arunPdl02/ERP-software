{% extends "base.html" %}
{% block title %}New Device — Cable TV ERP{% endblock %}
{% block page_title %}New Device{% endblock %}

{% block content %}
<div class="form-container">
    <div class="panel">
        <div class="panel-header"><h2 class="panel-title">Add Device</h2></div>
        <form method="POST" class="form-body">
            <div class="form-group">
                <label for="itemId" class="form-label">Item Type <span class="required">*</span></label>
                <select id="itemId" name="itemId" class="form-select" required>
                    <option value="">— Select Item —</option>
                    {% for i in items %}
                    <option value="{{ i.itemId }}"
                        {% if form.get('itemId')|string == i.itemId|string %}selected{% endif %}>
                        {{ i.itemName }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="cardNumber" class="form-label">Card Number <span class="required">*</span></label>
                <input type="text" id="cardNumber" name="cardNumber" class="form-input mono"
                       value="{{ form.get('cardNumber', '') if form else '' }}" required>
            </div>
            <div class="form-group">
                <label for="serialNumber" class="form-label">Serial Number <span class="required">*</span></label>
                <input type="text" id="serialNumber" name="serialNumber" class="form-input mono"
                       value="{{ form.get('serialNumber', '') if form else '' }}" required>
            </div>
            <div class="form-actions">
                <a href="{{ url_for('inventory.devices') }}" class="btn btn-ghost">Cancel</a>
                <button type="submit" class="btn btn-primary">Add Device</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
