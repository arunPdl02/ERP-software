{% extends "base.html" %}
{% block title %}New Item — Cable TV ERP{% endblock %}
{% block page_title %}New Inventory Item{% endblock %}

{% block content %}
<div class="form-container">
    <div class="panel">
        <div class="panel-header"><h2 class="panel-title">Create Item</h2></div>
        <form method="POST" class="form-body">
            <div class="form-group">
                <label for="itemName" class="form-label">Item Name <span class="required">*</span></label>
                <input type="text" id="itemName" name="itemName" class="form-input"
                       value="{{ form.get('itemName', '') if form else '' }}" required>
            </div>
            <div class="form-group">
                <label for="category" class="form-label">Category <span class="required">*</span></label>
                <select id="category" name="category" class="form-select" required>
                    <option value="">— Select Category —</option>
                    {% set cur_cat = form.get('category', '') if form else '' %}
                    <option value="Device" {% if cur_cat == 'Device' %}selected{% endif %}>Device</option>
                    <option value="Accessory" {% if cur_cat == 'Accessory' %}selected{% endif %}>Accessory</option>
                    <option value="Equipment" {% if cur_cat == 'Equipment' %}selected{% endif %}>Equipment</option>
                </select>
            </div>
            <div class="form-actions">
                <a href="{{ url_for('inventory.items') }}" class="btn btn-ghost">Cancel</a>
                <button type="submit" class="btn btn-primary">Create Item</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
