{% extends "base.html" %}
{% block title %}New Subscription — Cable TV ERP{% endblock %}
{% block page_title %}New Subscription{% endblock %}

{% block content %}
<div class="form-container">
    <div class="panel">
        <div class="panel-header"><h2 class="panel-title">Create Subscription</h2></div>
        <form method="POST" class="form-body">
            <div class="form-group">
                <label for="customerId" class="form-label">Customer <span class="required">*</span></label>
                <select id="customerId" name="customerId" class="form-select" required>
                    <option value="">— Select Customer —</option>
                    {% for c in customers %}
                    <option value="{{ c.customerId }}"
                        {% if form.get('customerId')|string == c.customerId|string %}selected{% endif %}>
                        {{ c.firstName }} {{ c.lastName }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="packageId" class="form-label">Package <span class="required">*</span></label>
                <select id="packageId" name="packageId" class="form-select" required>
                    <option value="">— Select Package —</option>
                    {% for p in packages %}
                    <option value="{{ p.packageId }}"
                        {% if form.get('packageId')|string == p.packageId|string %}selected{% endif %}>
                        {{ p.packageName }} — ${{ "%.2f"|format(p.monthlyPrice|float) }}/mo
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="startDate" class="form-label">Start Date <span class="required">*</span></label>
                <input type="date" id="startDate" name="startDate" class="form-input"
                       value="{{ form.get('startDate', '') if form else '' }}" required>
            </div>
            <div class="form-actions">
                <a href="{{ url_for('subscriptions.list_subscriptions') }}" class="btn btn-ghost">Cancel</a>
                <button type="submit" class="btn btn-primary">Create Subscription</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
