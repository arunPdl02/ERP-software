{% extends "base.html" %}
{% block title %}New Employee — Cable TV ERP{% endblock %}
{% block page_title %}New Employee{% endblock %}

{% block content %}
<div class="form-container">
    <div class="panel">
        <div class="panel-header"><h2 class="panel-title">Create Employee</h2></div>
        <form method="POST" class="form-body">
            <div class="form-group">
                <label for="username" class="form-label">Username <span class="required">*</span></label>
                <input type="text" id="username" name="username" class="form-input"
                       value="{{ form.get('username', '') if form else '' }}" required>
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Password <span class="required">*</span></label>
                <input type="password" id="password" name="password" class="form-input" required>
            </div>
            <div class="form-actions">
                <a href="{{ url_for('employees.list_employees') }}" class="btn btn-ghost">Cancel</a>
                <button type="submit" class="btn btn-primary">Create Employee</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
